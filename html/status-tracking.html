<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Status Tracking</title>
</head>
<body>
    <center>
    <h1>Status Tracking</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="complaint-validation.html">Complaint Validation</a> |
        <a href="complaint-registration.html">Complaint Registration</a> |
        <a href="status-tracking.html">Status Tracking</a> |
        <a href="feedback-and-rating.html">Feedback and Rating</a>
    </nav>
    <hr>

    <form id="trackingForm">
        <p>
            <label for="complaintId">Complaint ID:</label><br>
            <input type="number" id="complaintId" name="complaintId" min="1" step="1" required>
        </p>
        <p>
            <label for="category">Category:</label><br>
            <input type="text" id="category" name="category" required>
        </p>
        <button type="submit">Start Tracking</button>
    </form>

    <section id="updateSection">
        <h2>Complaint Update</h2>
        <p>Enter update (type Resolved when fixed)</p>
        <form id="updateForm">
            <label for="updateText">Update:</label>
            <input type="text" id="updateText" name="updateText" required>
            <button type="submit" id="updateButton">Update</button>
        </form>
    </section>

    <div id="trackingResult"></div>
    </center>
    <center>
    <footer>
        <p>&copy; 2026 CivicFix Team. All rights reserved.</p>
    </footer>
    </center>
</body>
</html>
